name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in x.y.z form (used when building manually)
        required: true
        default: 1.1.0
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ref = '${{ github.ref }}'
          if ($ref -like 'refs/tags/v*') {
            $version = '${{ github.ref_name }}'.Substring(1)
          } else {
            $version = '${{ inputs.version }}'
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use x.y.z form, got: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Run automated tests
        shell: pwsh
        run: >
          dotnet test tests/HotkeyLens.Core.Tests/HotkeyLens.Core.Tests.csproj
          --configuration Release --nologo -v:minimal
          -p:_MSTestEnableParentProcessQuery=false

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build setup and portable package
        shell: pwsh
        run: >
          ./packaging/build-release.ps1
          -Version '${{ steps.version.outputs.version }}'
          -InnoCompiler 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'

      - name: Verify packages on a clean runner
        shell: pwsh
        run: >
          ./packaging/verify-installer.ps1
          -Setup artifacts/dist/HotkeyLens-Setup.exe
          -PortableArchive artifacts/dist/HotkeyLens-Portable-win-x64.zip
          -Checksums artifacts/dist/SHA256SUMS.txt
          -WorkRoot artifacts/release-verify
          -AllowDefaultDataSentinel

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HotkeyLens-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/dist/HotkeyLens-Setup.exe
            artifacts/dist/HotkeyLens-Portable-win-x64.zip
            artifacts/dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $title = "HotkeyLens $tag"
          $notesFile = "docs/RELEASE_NOTES_$tag.md"
          $assets = @(
            'artifacts/dist/HotkeyLens-Setup.exe',
            'artifacts/dist/HotkeyLens-Portable-win-x64.zip',
            'artifacts/dist/SHA256SUMS.txt'
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $notesFile) {
              gh release create $tag $assets --title $title --notes-file $notesFile --latest
            } else {
              gh release create $tag $assets --title $title --generate-notes --latest
            }
          } else {
            gh release upload $tag $assets --clobber
            if ($LASTEXITCODE -eq 0) {
              if (Test-Path $notesFile) {
                gh release edit $tag --draft=false --latest --title $title --notes-file $notesFile
              } else {
                gh release edit $tag --draft=false --latest --title $title
              }
            }
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish release $tag."
          }